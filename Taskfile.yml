version: "3"

env:
  TS_VERSION_CHECK: "0"

tasks:
  setup:
    desc: Install pre-commit hooks, Grype, and commitlint
    cmds:
      - npm install
      - bash scripts/install-grype.sh
      - pre-commit install
      - pre-commit install --hook-type commit-msg

  fmt:
    desc: Format Rust, Terraform, and Dart
    cmds:
      - cmd: cargo fmt --all
        ignore_error: false
      - cmd: terraform fmt -recursive infra
      - cmd: |
          if [ -f apps/mobile/pubspec.yaml ]; then
            dart format apps/mobile/lib apps/mobile/test
          fi

  lint:
    desc: Lint Rust, workflows, and the partner export ban
    cmds:
      - cmd: |
          if [ -f Cargo.toml ]; then
            cargo clippy --workspace --all-targets -- -D warnings
          fi
      - task: lint:actions
      - task: lint:partner-export
      - task: lint:ci-workflow

  lint:actions:
    internal: true
    cmds:
      - cmd: |
          if ls .github/workflows/*.yml >/dev/null 2>&1; then
            if command -v actionlint >/dev/null 2>&1; then
              actionlint
            else
              go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
              "$(go env GOPATH)/bin/actionlint"
            fi
          fi

  lint:partner-export:
    internal: true
    cmds:
      - bash scripts/check-partner-export.sh

  lint:ci-workflow:
    internal: true
    cmds:
      - bash scripts/check-ci-workflow.sh

  test:
    desc: Run Rust, Flutter, Terraform, and commitlint fixture tests
    cmds:
      - bash scripts/commitlint-fixture.sh
      - cmd: |
          if [ -f Cargo.toml ]; then
            cargo test --workspace
          fi
      - cmd: |
          if [ -f apps/mobile/pubspec.yaml ]; then
            (cd apps/mobile && flutter test)
          fi
      - cmd: |
          if [ -d infra/app/stacks/bootstrap ] && [ -f infra/app/stacks/bootstrap/versions.tf ]; then
            terraform -chdir=infra/app/stacks/bootstrap fmt -check
            terraform -chdir=infra/app/stacks/bootstrap init -backend=false -input=false
            terraform -chdir=infra/app/stacks/bootstrap validate
          fi
      - cmd: |
          if [ -f infra/app/stacks/relay/versions.tf ]; then
            terraform -chdir=infra/app/stacks/relay fmt -check
            terraform -chdir=infra/app/stacks/relay init -backend=false -input=false
            terraform -chdir=infra/app/stacks/relay validate
          fi

  ci:
    desc: Check each codebase. The checks run in parallel.
    deps: [ci:core, ci:relay, ci:mobile, ci:bootstrap, ci:relay-stack, ci:workflows, ci:commitlint]

  ci:hooks:
    desc: Run whitespace, YAML, Gitleaks, and Grype pre-commit hooks
    cmds:
      - SKIP=commitlint,rustfmt,terraform-fmt,flutter-format pre-commit run --all-files

  ci:core:
    desc: Format, lint, and test crates/core
    cmds:
      - cargo fmt -p ouroboros-core -- --check
      - cargo clippy -p ouroboros-core --all-targets -- -D warnings
      - cargo test -p ouroboros-core

  ci:relay:
    desc: Format, lint, and test services/relay
    cmds:
      - cargo fmt -p ouroboros-relay -- --check
      - cargo clippy -p ouroboros-relay --all-targets -- -D warnings
      - cargo test -p ouroboros-relay

  ci:mobile:
    desc: Format, analyze, and test apps/mobile
    cmds:
      - bash -c 'cd apps/mobile && flutter pub get && dart format --set-exit-if-changed lib test && flutter analyze && flutter test'
      - bash scripts/check-partner-export.sh

  ci:bootstrap:
    desc: Format and validate infra/app/stacks/bootstrap
    cmds:
      - terraform -chdir=infra/app/stacks/bootstrap fmt -check
      - terraform -chdir=infra/app/stacks/bootstrap init -backend=false -input=false
      - terraform -chdir=infra/app/stacks/bootstrap validate

  ci:relay-stack:
    desc: Format and validate infra/app/stacks/relay
    cmds:
      - terraform -chdir=infra/app/stacks/relay fmt -check
      - terraform -chdir=infra/app/stacks/relay init -backend=false -input=false
      - terraform -chdir=infra/app/stacks/relay validate

  ci:workflows:
    desc: Lint .github/workflows
    cmds:
      - task: lint:actions
      - task: lint:ci-workflow

  ci:commitlint:
    desc: Reject a commit message that is not a Conventional Commit
    cmds:
      - bash scripts/commitlint-fixture.sh

  mobile:apk:
    desc: Build the signed Android APK
    cmds:
      - cmd: |
          if [ ! -f apps/mobile/pubspec.yaml ]; then
            echo "the app is not created yet" >&2
            exit 1
          fi
          (cd apps/mobile && flutter build apk --release)

  mobile:ipa:
    desc: Build the signed iOS IPA
    cmds:
      - cmd: |
          if [ ! -f apps/mobile/pubspec.yaml ]; then
            echo "the app is not created yet" >&2
            exit 1
          fi
          (cd apps/mobile && flutter build ipa --release)

  infra:fmt:
    desc: Format Terraform
    cmds:
      - terraform fmt -recursive infra

  infra:bootstrap:
    desc: Apply the bootstrap stack with local admin credentials
    cmds:
      - |
        set -euo pipefail
        GCP_AUTH_WITH_PROJECT_NUMBER=1
        # shellcheck disable=SC1091
        source scripts/gcp-user-auth.sh
        terraform -chdir=infra/app/stacks/bootstrap init -input=false -reconfigure
        terraform -chdir=infra/app/stacks/bootstrap apply -input=false -auto-approve

  infra:up:
    desc: Apply the relay stack for ENV=dev or ENV=prod
    cmds:
      - |
        if [ "{{.ENV}}" != "dev" ] && [ "{{.ENV}}" != "prod" ]; then
          echo "ENV must be dev or prod" >&2
          exit 1
        fi
        set -euo pipefail
        # shellcheck disable=SC1091
        source scripts/gcp-user-auth.sh
        terraform -chdir=infra/app/stacks/relay init -input=false -reconfigure -backend-config=prefix={{.ENV}}
        image_var=""
        if [ -n "{{.IMAGE}}" ]; then
          image_var="-var image={{.IMAGE}}"
        fi
        # shellcheck disable=SC2086
        terraform -chdir=infra/app/stacks/relay apply -input=false -auto-approve -var-file={{.ENV}}.tfvars $image_var
    vars:
      ENV: '{{.ENV | default "dev"}}'
      IMAGE: '{{.IMAGE | default ""}}'
