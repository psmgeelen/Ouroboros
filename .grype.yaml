# Fail the scan when a finding is high or critical.
fail-on-severity: high

# Skip generated trees; lockfiles at the repo root are still scanned.
exclude:
  - "./node_modules/**"
  - "./target/**"
  - "./apps/mobile/.dart_tool/**"
  - "./apps/mobile/build/**"
  - "./infra/.terraspace-cache/**"
  - "./infra/**/.terraform/**"
