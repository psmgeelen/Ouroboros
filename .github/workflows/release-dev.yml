name: release-dev

# dev tags look like vX.Y.Z-dev.N
on:
  push:
    branches: [dev]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: hashicorp/setup-terraform@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: bash scripts/install-task.sh
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
      - run: npm ci
      - run: task ci
      - id: release
        run: |
          set -euo pipefail
          npx semantic-release
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "${tag}" ]; then
            echo "semantic-release did not tag this commit"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish relay image
        run: |
          set -euo pipefail
          registry=europe-west1-docker.pkg.dev/ouroboros-devops/ouroboros/relay
          echo "${{ steps.auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://europe-west1-docker.pkg.dev
          docker build -f services/relay/Dockerfile \
            --label org.opencontainers.image.version="${{ steps.release.outputs.version }}" \
            --label environment=dev \
            -t "${registry}:${{ steps.release.outputs.version }}" \
            -t "${registry}:dev" \
            .
          docker push "${registry}:${{ steps.release.outputs.version }}"
          docker push "${registry}:dev"
      - run: task infra:up ENV=dev IMAGE=europe-west1-docker.pkg.dev/ouroboros-devops/ouroboros/relay:${{ steps.release.outputs.version }}
      - name: Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Android signing secret is absent; not publishing an unsigned build"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/upload.jks
          (cd apps/mobile && flutter build apk --release)
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk ouroboros-android.apk
      - uses: softprops/action-gh-release@v2
        if: hashFiles('ouroboros-android.apk') != ''
        with:
          files: ouroboros-android.apk
          fail_on_unmatched_files: false

  ios:
    runs-on: macos-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.3"
      - name: iOS IPA
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ] || [ -z "$APPLE_PROVISIONING_PROFILE_BASE64" ]; then
            echo "Apple signing secrets are absent; not publishing an unsigned build"
            exit 0
          fi
          (cd apps/mobile && flutter build ipa --release)
          cp apps/mobile/build/ios/ipa/*.ipa ouroboros-ios.ipa
      - uses: softprops/action-gh-release@v2
        if: hashFiles('ouroboros-ios.ipa') != ''
        with:
          files: ouroboros-ios.ipa
          fail_on_unmatched_files: false
