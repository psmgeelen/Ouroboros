name: promote-relay

# dev and prod move an image main already pushed. This workflow does not
# docker build. A missing SHA tag fails and asks for a main build first.
on:
  push:
    branches: [dev, prod]
    paths:
      - services/relay/**
      - crates/core/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - infra/app/stacks/relay/**

permissions:
  contents: write
  id-token: write

concurrency:
  group: promote-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            source:
              - 'services/relay/**'
              - 'crates/core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            infra:
              - 'infra/app/stacks/relay/**'

  promote:
    needs: changes
    if: needs.changes.outputs.source == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.source == 'true'
        with:
          node-version: "24"
          cache: npm
      - run: bash scripts/install-task.sh
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
      - run: npm ci
        if: needs.changes.outputs.source == 'true'
      - id: release
        if: needs.changes.outputs.source == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npx semantic-release
          if [ "$ENV_NAME" = "prod" ]; then
            tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          else
            tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$' | sort -V | tail -1 || true)
          fi
          if [ -n "${tag}" ]; then
            echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          fi
      - id: image
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SHA: ${{ github.sha }}
          ENV_NAME: ${{ github.ref_name }}
          SOURCE_CHANGED: ${{ needs.changes.outputs.source }}
        run: |
          set -euo pipefail
          if [ "$ENV_NAME" != "dev" ] && [ "$ENV_NAME" != "prod" ]; then
            echo "promotion requires the dev or prod branch"
            exit 1
          fi
          version="${VERSION:-}"
          registry=europe-west1-docker.pkg.dev/ouroboros-devops/ouroboros/relay
          image="${registry}:${ENV_NAME}"
          if [ "$SOURCE_CHANGED" = "true" ]; then
            echo "$ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin https://europe-west1-docker.pkg.dev
            if ! docker pull "${registry}:${SHA}"; then
              echo "the image has to be built on main first"
              exit 1
            fi
            docker tag "${registry}:${SHA}" "${registry}:${ENV_NAME}"
            docker push "${registry}:${ENV_NAME}"
            if [ -n "$version" ]; then
              docker tag "${registry}:${SHA}" "${registry}:${version}"
              docker push "${registry}:${version}"
              image="${registry}:${version}"
            fi
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - run: task infra:up ENV=${{ github.ref_name }} IMAGE=${{ steps.image.outputs.image }}
