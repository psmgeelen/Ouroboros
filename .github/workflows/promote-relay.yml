name: promote-relay

# dev and prod move an image main already pushed. This workflow does not
# docker build. A missing SHA tag fails and asks for a main build first.
on:
  push:
    branches: [dev, prod]
    paths:
      - services/relay/**
      - crates/core/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - infra/app/stacks/relay/**
  workflow_dispatch:
    inputs:
      force_source:
        description: Retag the main SHA image and run semantic-release
        type: boolean
        default: true
      image_sha:
        description: Main build commit to retag (defaults to this branch tip)
        type: string
        required: false
        default: ""
      version:
        description: Version label without v (defaults to release tag on that commit)
        type: string
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: promote-relay-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.out.outputs.source }}
      infra: ${{ steps.out.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Compare against the previous tip of this branch. Default dorny behavior
      # compares main...branch, which is empty after promoting the same SHA.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            source:
              - 'services/relay/**'
              - 'crates/core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            infra:
              - 'infra/app/stacks/relay/**'
      - id: out
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_SOURCE: ${{ github.event.inputs.force_source }}
          FILTER_SOURCE: ${{ steps.filter.outputs.source }}
          FILTER_INFRA: ${{ steps.filter.outputs.infra }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$FORCE_SOURCE" = "true" ]; then
              echo "source=true" >> "$GITHUB_OUTPUT"
              echo "infra=false" >> "$GITHUB_OUTPUT"
            else
              echo "source=false" >> "$GITHUB_OUTPUT"
              echo "infra=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "source=${FILTER_SOURCE:-false}" >> "$GITHUB_OUTPUT"
            echo "infra=${FILTER_INFRA:-false}" >> "$GITHUB_OUTPUT"
          fi

  promote:
    needs: changes
    if: needs.changes.outputs.source == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.source == 'true'
        with:
          node-version: "24"
          cache: npm
      - run: bash scripts/install-task.sh
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
      - run: npm ci
        if: needs.changes.outputs.source == 'true'
      - id: release
        if: needs.changes.outputs.source == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_SHA: ${{ github.event.inputs.image_sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-$GITHUB_SHA}"
          if [ -n "${INPUT_VERSION}" ]; then
            echo "VERSION=${INPUT_VERSION}" >> "$GITHUB_ENV"
            echo "IMAGE_SHA=${sha}" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            npx semantic-release
          else
            # Manual retag of an already-cut release; do not invent a new version.
            npx semantic-release || true
          fi
          if [ "$ENV_NAME" = "prod" ]; then
            tag=$(git tag --points-at "$sha" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          else
            tag=$(git tag --points-at "$sha" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$' | sort -V | tail -1 || true)
          fi
          if [ -n "${tag}" ]; then
            echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          fi
          echo "IMAGE_SHA=${sha}" >> "$GITHUB_ENV"
      - id: image
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ENV_NAME: ${{ github.ref_name }}
          SOURCE_CHANGED: ${{ needs.changes.outputs.source }}
          INPUT_SHA: ${{ github.event.inputs.image_sha }}
        run: |
          set -euo pipefail
          if [ "$ENV_NAME" != "dev" ] && [ "$ENV_NAME" != "prod" ]; then
            echo "promotion requires the dev or prod branch"
            exit 1
          fi
          sha="${IMAGE_SHA:-${INPUT_SHA:-$GITHUB_SHA}}"
          version="${VERSION:-}"
          registry=europe-west1-docker.pkg.dev/ouroboros-devops/ouroboros/relay
          image="${registry}:${ENV_NAME}"
          if [ "$SOURCE_CHANGED" = "true" ]; then
            echo "$ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin https://europe-west1-docker.pkg.dev
            if ! docker pull "${registry}:${sha}"; then
              echo "the image has to be built on main first"
              exit 1
            fi
            docker tag "${registry}:${sha}" "${registry}:${ENV_NAME}"
            docker push "${registry}:${ENV_NAME}"
            if [ -n "$version" ]; then
              docker tag "${registry}:${sha}" "${registry}:${version}"
              docker push "${registry}:${version}"
              image="${registry}:${version}"
            fi
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - run: task infra:up ENV=${{ github.ref_name }} IMAGE=${{ steps.image.outputs.image }}
