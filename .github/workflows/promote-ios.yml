name: promote-ios

# dev and prod attach the IPA that main already built. This workflow does
# not install Flutter and does not publish an unsigned build.
on:
  push:
    branches: [dev, prod]
    paths:
      - apps/mobile/lib/**
      - apps/mobile/test/**
      - apps/mobile/ios/**
      - apps/mobile/pubspec.yaml
      - apps/mobile/pubspec.lock

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-ios-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npx semantic-release
          if [ "$ENV_NAME" = "prod" ]; then
            tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          else
            tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$' | sort -V | tail -1 || true)
          fi
          if [ -n "${tag}" ]; then
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "no release tag on this commit; the IPA stays on the main build"
          fi
      - name: Download IPA built on main
        id: ipa
        if: steps.release.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          name="ouroboros-ios-${SHA}"
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-ios.yml --commit "$SHA" --status success --json databaseId --jq '.[0].databaseId')
          if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
            echo "No successful iOS build on main for ${SHA}. Push main and wait for the build before promoting."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$name" --dir ipa
          if [ -f ipa/skipped ]; then
            echo "Apple signing secrets are absent; not publishing an unsigned build"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp ipa/ouroboros-ios.ipa ouroboros-ios.ipa
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        if: steps.ipa.outputs.publish == 'true'
        with:
          tag_name: v${{ steps.release.outputs.version }}
          files: ouroboros-ios.ipa
          fail_on_unmatched_files: false
          prerelease: ${{ github.ref_name == 'dev' }}
          make_latest: ${{ github.ref_name == 'prod' }}
